name: Build installers

# Manual test build for every platform, without a tag or a release: Actions > Build installers >
# Run workflow (pick a branch). Installers are attached to the run as artifacts (kept 14 days),
# unsigned. Releases go through release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            paths: nsis/*-setup.exe
          - label: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            paths: dmg/*.dmg
          - label: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            paths: dmg/*.dmg
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            paths: deb/*.deb rpm/*.rpm appimage/*.AppImage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies for Tauri 2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev build-essential curl wget file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: build-${{ matrix.target }}

      - run: npm ci

      - name: Build bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Collect installers
        run: |
          mkdir -p out
          cd "src-tauri/target/${{ matrix.target }}/release/bundle"
          for pattern in ${{ matrix.paths }}; do
            # An unmatched glob stays literal: fail instead of uploading nothing.
            [ -f "$pattern" ] || { echo "::error::No installer matches $pattern"; ls -R . | head -50; exit 1; }
          done
          cp ${{ matrix.paths }} "$GITHUB_WORKSPACE/out/"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: SSHStudio-${{ matrix.label }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

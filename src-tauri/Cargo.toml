[package]
name = "ssh-studio"
version = "0.1.0"
description = "Multi-server SSH and SFTP desktop workspace"
edition = "2024"
license = "MIT"
repository = "https://github.com/rickymta/ssh-studio"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
keyring = "4.2"
aes-gcm = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
rand = "0.10"
# Vault backups: password → key derivation (F6).
argon2 = "0.6"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
# Same versions ssh-key already uses for PuTTY keys; only needed to build .ppk test vectors.
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
futures = "0.3"

# Argon2 is unusably slow without optimizations (PPK v3 tests, vault backups).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[features]
custom-protocol = ["tauri/custom-protocol"]

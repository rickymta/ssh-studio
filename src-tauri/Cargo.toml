[package]
name = "ssh-studio"
version = "0.1.0"
description = "Multi-server SSH and SFTP desktop workspace"
edition = "2024"
license = "MIT"
repository = "https://github.com/rickymta/ssh-studio"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
keyring = "4.2"
aes-gcm = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
rand = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
